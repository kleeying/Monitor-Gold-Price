name: UOB gold price watch

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:          # allows manual runs

permissions:
  contents: write

concurrency: gold-watch

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright requests
      - run: playwright install --with-deps chromium
      - run: python check_price.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          PRICE_THRESHOLD: ${{ vars.PRICE_THRESHOLD }}
      - name: Save alert price and state
        if: always()
        run: |
          git config user.name "gold-watch-bot"
          git config user.email "gold-watch-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update state" && git push)
